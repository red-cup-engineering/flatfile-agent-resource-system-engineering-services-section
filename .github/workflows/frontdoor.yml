name: Repository first-visit audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontdoor:
    uses: red-cup-engineering/repository-norms/.github/workflows/frontdoor.yml@cb8a9e45ad2f7f6f31fa99a5cef5b033f4051e86
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm run check
