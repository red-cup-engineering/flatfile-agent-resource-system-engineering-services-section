[project]
name = "pyfars"
version = "0.2.0"
description = "PyFARS — Python implementation of FARS (Flatfile Agentic Resource System): substrate, operators, closure-rule system, and runtime scaffolding for a predication-graph-shaped flatfile corpus."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "mcp>=1.0",
    "authlib>=1.3",
    "cryptography>=42",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-ai>=1.89",
    "langgraph>=1.0",
    "anthropic>=0.94",
    "openai>=2.29",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pypredcalc>=0.2",
]

# pypredcalc is a sibling 561 Group tool, not yet on PyPI.
# uv pulls it from git+ssh during `uv lock`; uv2nix consumes the
# resulting lock entry. When pypredcalc is publicly released to
# PyPI, drop this section — uv falls back to PyPI resolution.
[tool.uv.sources]
pypredcalc = { git = "ssh://git@github.com/emsenn/pypred", branch = "main" }

# uv2nix builds without isolation, so build-system requirements must
# be visible to the builder. pypredcalc's own [build-system].requires
# names setuptools, but uv's no-isolation mode doesn't pre-install
# build deps from there. This block tells uv to add setuptools to
# pypredcalc's build env explicitly. Drop once pypredcalc moves to
# uv_build (or PyPI release with prebuilt wheels).
[tool.uv.extra-build-dependencies]
pypredcalc = ["setuptools"]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
pyfars = "pyfars.apps.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyfars.apps.materializer_templates" = ["**/_index.md", "**/templates/**/*.j2"]
"pyfars.programs.web" = ["templates/**/*.html"]
