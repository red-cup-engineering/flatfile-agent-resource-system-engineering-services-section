[project]
name = "pyfars"
version = "0.1.0"
description = "PyFARS — Python implementation of FARS (Flatfile Agentic Resource System): substrate, operators, closure-rule system, and runtime scaffolding for a predication-graph-shaped flatfile corpus."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "mcp>=1.0",
    "authlib>=1.3",
    "httpx>=0.27",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
pyfars = "pyfars.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyfars.harnesses" = ["**/_index.md", "**/templates/**/*.j2"]
